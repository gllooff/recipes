<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ui.appTitle">食谱</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="auth-screen" class="auth-screen hidden" aria-label="Sign in" data-i18n-aria-label="auth.signIn">
    <div class="auth-card">
      <div class="lang-toggle-row">
        <button type="button" class="secondary lang-toggle" data-lang-toggle>English</button>
      </div>
      <p class="eyebrow" data-i18n="ui.eyebrow">个人菜谱</p>
      <h1 data-i18n="ui.appTitle">食谱</h1>
      <p class="subtitle" data-i18n="ui.subtitleAuth">私人空间 — 登录后继续。</p>
      <form id="auth-form" class="auth-form">
        <label><span data-i18n="auth.email">邮箱</span> <input id="auth-email" type="email" required autocomplete="email"></label>
        <label><span data-i18n="auth.password">密码</span> <input id="auth-password" type="password" required autocomplete="current-password"></label>
        <button type="submit" data-i18n="auth.signIn">登录</button>
        <p id="auth-error" class="status error hidden" role="alert"></p>
      </form>
    </div>
  </section>

  <main id="app" class="app">
    <header>
      <div class="lang-toggle-row">
        <button type="button" class="secondary lang-toggle" data-lang-toggle>English</button>
      </div>
      <p class="eyebrow" data-i18n="ui.eyebrow">个人菜谱</p>
      <h1 data-i18n="ui.appTitle">食谱</h1>
      <p class="subtitle" data-i18n="ui.subtitleMain">记录并浏览你最喜欢的菜品。</p>
      <div class="header-actions">
        <button type="button" id="logout" class="secondary logout hidden" data-i18n="header.signOut">退出登录</button>
        <button type="button" id="add-recipe-toggle" class="logout hidden" data-i18n="header.addRecipe">添加菜谱</button>
        <button type="button" id="refresh" class="logout hidden" data-i18n="header.refresh">刷新</button>
      </div>
    </header>

    <section id="config-banner" class="config-banner hidden" aria-live="polite" data-i18n-html="ui.configBanner">
      未连接到数据库。请在 <code>config.js</code> 中填入 Supabase URL 和 anon 密钥。
    </section>

    <section class="recipes" aria-label="Saved recipes" data-i18n-aria-label="recipes.saved">
      <div class="recipes-header">
        <h2 data-i18n="recipes.saved">已保存的菜谱</h2>
        <div class="recipes-header-actions">
          <input id="search" type="search" placeholder="搜索菜谱…" autocomplete="off" aria-label="Search recipes" data-i18n-placeholder="recipes.search" data-i18n-aria-label="recipes.search">
          <button type="button" id="tag-filter-btn" class="secondary" data-i18n="recipes.tags">标签</button>
          <button type="button" id="recycle-bin-btn" class="secondary recycle-bin-btn hidden" title="Recycle bin" aria-label="Open recycle bin" data-i18n-title="bin.title" data-i18n-aria-label="bin.open">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5.5 6h13"/>
              <path d="M6.5 6 7.4 18.8a2 2 0 0 0 2 2h5.2a2 2 0 0 0 2-2L17.5 6"/>
              <g transform="translate(6.375 6.8) scale(0.5)" stroke-width="3.8">
                <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/>
                <path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/>
                <path d="m14 16-3 3 3 3"/>
                <path d="M8.293 13.596 7.196 9.5 3.1 10.598"/>
                <path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/>
                <path d="m13.378 9.633 4.096 1.098 1.097-4.096"/>
              </g>
            </svg>
          </button>
        </div>
      </div>
      <div id="tag-filter" class="tag-filter hidden" aria-live="polite">
        <span class="tag-filter-label" data-i18n="recipes.filterBy">按以下筛选：</span>
        <div id="tag-filter-chips" class="tag-chips"></div>
        <button type="button" id="tag-filter-clear" class="secondary" data-i18n="recipes.clear">清除</button>
      </div>
      <div class="recipes-toolbar">
        <p id="count" class="count" aria-live="polite"></p>
        <label class="sort"><span data-i18n="recipes.sort">排序</span>
          <select id="sort">
            <option value="created_at-desc" selected data-i18n="recipes.sortNewest">最新</option>
            <option value="created_at-asc" data-i18n="recipes.sortOldest">最早</option>
            <option value="title-asc" data-i18n="recipes.sortNameAz">名称 A–Z</option>
            <option value="title-desc" data-i18n="recipes.sortNameZa">名称 Z–A</option>
          </select>
        </label>
        <label class="page-size"><span data-i18n="recipes.perPage">每页</span>
          <select id="page-size">
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="40">40</option>
            <option value="0">∞</option>
          </select>
        </label>
      </div>
      <ul id="recipe-list" class="recipe-list"></ul>
      <nav id="pagination" class="pagination hidden" aria-label="Recipe pages" data-i18n-aria-label="recipes.pages"></nav>
      <p id="empty" class="empty hidden" data-i18n="recipes.empty">还没有菜谱，点击上方按钮添加第一个。</p>
      <p id="status" class="status" role="status"></p>
    </section>

    <section id="add-recipe-section" class="controls hidden" aria-label="Add a recipe" data-i18n-aria-label="form.add">
      <div class="add-recipe-panel">
        <div class="modal-header">
          <h2 data-i18n="form.add">添加菜谱</h2>
        </div>
        <form id="recipe-form" class="recipe-form">
          <label><span data-i18n="form.title">标题</span> <input id="title" name="title" type="text" required placeholder="例如：咖喱鸡" autocomplete="off" data-i18n-placeholder="form.titlePlaceholder"></label>
          <label><span data-i18n="form.notes">备注</span> <textarea id="notes" name="notes" rows="2" placeholder="可选" data-i18n-placeholder="form.optional"></textarea></label>

          <div class="form-group">
            <h3 data-i18n="form.tags">标签</h3>
            <div id="tag-chips" class="tag-chips"></div>
            <button type="button" id="tag-browse-btn" class="secondary" data-i18n="form.browseTags">浏览标签</button>
          </div>

          <div class="form-group">
            <h3 data-i18n="form.ingredients">食材</h3>
            <div id="ingredients-editor" data-kind="ingredient"></div>
            <button type="button" class="secondary add-row" data-kind="ingredient" data-i18n="form.addIngredient">+ 添加食材</button>
          </div>

          <div class="form-group">
            <h3 data-i18n="form.steps">步骤</h3>
            <div id="steps-editor" data-kind="step"></div>
            <button type="button" class="secondary add-row" data-kind="step" data-i18n="form.addStep">+ 添加步骤</button>
          </div>

          <div class="form-group">
            <h3 data-i18n="form.cookware">厨具</h3>
            <div id="cookware-editor" data-kind="cookware"></div>
            <button type="button" class="secondary add-row" data-kind="cookware" data-i18n="form.addCookware">+ 添加厨具</button>
          </div>

          <div class="form-group">
            <h3 data-i18n="form.media">菜谱照片和视频</h3>
            <div id="recipe-media-preview" class="media-previews"></div>
            <label class="file-label"><span data-i18n="form.addFiles">添加文件</span>
              <input id="recipe-media" type="file" accept="image/*,video/*" multiple>
            </label>
          </div>

          <div class="actions">
            <button type="submit" data-i18n="form.save">保存菜谱</button>
            <button type="button" id="cancel-form" data-i18n="form.cancel">取消</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="recycle-bin" class="modal hidden" role="dialog" aria-modal="true" aria-label="Recycle bin" data-i18n-aria-label="bin.title">
    <div class="modal-panel recycle-bin-panel">
      <div class="modal-header">
        <h2 data-i18n="bin.title">回收站</h2>
        <button type="button" id="recycle-bin-close" class="secondary" data-i18n="ui.close">关闭</button>
      </div>
      <p id="recycle-bin-count" class="count"></p>
      <ul id="recycle-bin-list" class="recycle-bin-list"></ul>
      <div class="modal-actions">
        <button type="button" id="recycle-bin-restore-all" class="secondary" data-i18n="bin.restoreAll">全部恢复</button>
        <button type="button" id="recycle-bin-empty" class="danger" data-i18n="bin.emptyBin">清空回收站</button>
      </div>
    </div>
  </div>
  <div id="tag-picker" class="modal hidden" role="dialog" aria-modal="true" aria-label="Choose tags" data-i18n-aria-label="tags.choose">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="tag-picker-title">按标签筛选</h2>
        <button type="button" id="tag-picker-close" class="secondary" data-i18n="ui.close">关闭</button>
      </div>
      <input id="tag-picker-search" type="search" placeholder="搜索标签…" autocomplete="off" aria-label="Search tags" data-i18n-placeholder="tags.search" data-i18n-aria-label="tags.search">
      <div id="tag-picker-selected" class="tag-chips hidden"></div>
      <p id="tag-picker-count" class="count"></p>
      <ul id="tag-picker-list" class="tag-picker-list"></ul>
      <nav id="tag-picker-pagination" class="pagination hidden" aria-label="Tag pages" data-i18n-aria-label="tags.pages"></nav>
      <div class="modal-actions">
        <button type="button" id="tag-picker-create" class="secondary hidden">+ Create tag</button>
        <button type="button" id="tag-picker-apply" data-i18n="tags.apply">应用</button>
      </div>
    </div>
  </div>
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Media viewer">
    <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close" data-i18n-aria-label="ui.close">&times;</button>
  </div>
  <button type="button" id="back-to-top" class="back-to-top hidden" aria-label="Back to top" data-i18n-aria-label="backToTop">↑</button>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
